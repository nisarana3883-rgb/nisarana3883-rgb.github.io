<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NISARANA Games</title>
<meta name="description" content="เกมมือถือโดย NISARANA">
<style>
:root{--bg:#f6f1ea;--fg:#2a2420;--dim:#776c63;--card:#fffdf9;--line:#e4dacd;--accent:#b0262f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121014;--fg:#ece4da;--dim:#a49aa0;--card:#1c181e;--line:#332c35;--accent:#e05560;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121014;--fg:#ece4da;--dim:#a49aa0;--card:#1c181e;--line:#332c35;--accent:#e05560;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Sarabun","Leelawadee UI",Tahoma,sans-serif;line-height:1.6;padding:40px 16px}
main{max-width:640px;margin:0 auto}
h1{font-size:1.8rem;margin:0;letter-spacing:.04em}
.sub{color:var(--dim);margin:2px 0 28px}
.game{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.game img{width:72px;height:72px;border-radius:16px;flex:none}
.game h2{font-size:1.15rem;margin:0}
.game p{margin:2px 0 6px;color:var(--dim);font-size:.95rem}
a{color:var(--accent)}
footer{margin-top:32px;color:var(--dim);font-size:.9rem;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<main>
  <h1>NISARANA</h1>
  <p class="sub">เกมมือถือสัญชาติไทย</p>

  <div class="game">
    <img src="ruen-chum/icon.png" alt="ไอคอนเกมเรือนชำยามวิกาล">
    <div>
      <h2>เรือนชำยามวิกาล</h2>
      <p>เฝ้าร้านชำของยายริมคลองตอนเที่ยงคืน ขายของให้ลูกค้าที่ไม่ใช่คน</p>
      <a href="ruen-chum/privacy.html">นโยบายความเป็นส่วนตัว</a>
    </div>
  </div>

  <div class="game">
    <img src="boss-is-out/icon.png" alt="ไอคอนเกมหัวหน้าไม่อยู่">
    <div>
      <h2>หัวหน้าไม่อยู่</h2>
      <p>ป๊อปบับเบิ้ล ทุบอีเมล แอบงีบ ระบายเครียดชาวออฟฟิศ</p>
      <a href="boss-is-out/privacy.html">นโยบายความเป็นส่วนตัว</a>
    </div>
  </div>

  <footer>ติดต่อผู้พัฒนา: <a href="mailto:nisarana3883@gmail.com">nisarana3883@gmail.com</a></footer>
</main>
</body>
</html>
